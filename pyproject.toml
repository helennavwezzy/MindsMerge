[project]
name = "wforum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt~=5.0.0",
    "beautifulsoup4~=4.14.3",
    "colorama~=0.4.6",
    "coverage~=7.12.0",
    "google-adk~=1.20.0",
    "graphiti-core[falkordb,google-genai]~=0.24.1",
    "litellm>=1.80.7",
    "lxml~=6.0.2",
    "neo4j~=6.0.3",
    "pydantic[email]~=2.12.4",
    "pytest~=9.0.1",
    "pytest-asyncio~=1.3.0",
    "python-dotenv~=1.2.1",
    "python-jose[cryptography]~=3.5.0",
    "rich>=14.2.0",
]

[dependency-groups]
dev = [
    "pipdeptree~=2.30.0",
    "pre-commit~=4.3.0",
    "ruff~=0.14.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["wforum", "libs"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.uv.sources]
graphiti-core = { git = "https://github.com/getzep/graphiti.git" }
